<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据结构测试</title>
</head>
<body>
    <h1>数据结构测试</h1>
    <div id="output"></div>
    
    <script>
        // 测试新的数据结构
        const testData = {
            timestamp: new Date().toISOString(),
            tableData: [
                {
                    "空": "ly",
                    "originalIndex": 0,
                    "y": "",
                    "t": "",
                    "x": "",
                    "b": "",
                    "s": "",
                    "q": "",
                    "z1": 0,
                    "z2": 66,
                    "j": "",
                    "z": 66,
                    "r": 1
                },
                {
                    "空": "zx",
                    "originalIndex": 1,
                    "y": 3,
                    "t": 3,
                    "x": 1,
                    "b": 2,
                    "s": 1,
                    "q": 1,
                    "z1": 11,
                    "z2": 55,
                    "j": "",
                    "z": 55,
                    "r": 2
                }
            ],
            colOrder: ["空", "y", "t", "x", "b", "s", "q", "z1", "z2", "j", "z", "r"]
        };
        
        const output = document.getElementById('output');
        
        // 测试数据加载
        function testDataLoading() {
            output.innerHTML = '<h2>测试数据加载</h2>';
            
            // 模拟加载数据
            const data = testData;
            const tableData = data.tableData;
            const colOrder = data.colOrder;
            
            output.innerHTML += '<p>✅ 数据加载成功</p>';
            output.innerHTML += `<p>总行数: ${tableData.length}</p>`;
            output.innerHTML += `<p>列顺序: ${colOrder.join(', ')}</p>`;
            
            // 显示每行的标签
            output.innerHTML += '<h3>行标签:</h3>';
            tableData.forEach((row, index) => {
                output.innerHTML += `<p>行 ${index}: ${row.空}</p>`;
            });
            
            // 测试向后兼容性
            const oldFormatData = {
                ...data,
                rowLabels: ['ly', 'zx', 'xy', 'xm', 'jn', 'cz', 'dn', 'yn', 'sy', 'xn', 'qm']
            };
            
            // 移除新格式的"空"字段
            const oldTableData = tableData.map(row => {
                const { 空, ...rest } = row;
                return rest;
            });
            
            output.innerHTML += '<h2>测试向后兼容性</h2>';
            output.innerHTML += '<p>模拟旧格式数据（包含rowLabels但没有"空"字段）</p>';
            
            // 处理向后兼容性
            if (oldFormatData.rowLabels && Array.isArray(oldFormatData.rowLabels)) {
                console.log('检测到旧格式数据，正在转换为新格式...');
                oldTableData.forEach((row, index) => {
                    if (!row.空 && oldFormatData.rowLabels[index]) {
                        row.空 = oldFormatData.rowLabels[index];
                    }
                });
                output.innerHTML += '<p>✅ 向后兼容性处理成功</p>';
            }
            
            // 显示转换后的数据
            output.innerHTML += '<h3>转换后的行标签:</h3>';
            oldTableData.forEach((row, index) => {
                output.innerHTML += `<p>行 ${index}: ${row.空}</p>`;
            });
        }
        
        // 运行测试
        testDataLoading();
    </script>
</body>
</html>
