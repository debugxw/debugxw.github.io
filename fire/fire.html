<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>烈火灼心</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #8a9099;
      --line: #edf0f2;
      --head: #f8f9fa;
      --accent: #1f2430;
      --accent-dark: #111827;
      --error: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    main {
      width: min(1380px, calc(100vw - 72px));
      margin: 42px auto 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: none;
      padding: 0;
      overflow-x: auto;
    }

    .toolbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 0 0 38px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 0.02em;
      font-weight: 800;
      line-height: 1.3;
    }

    .actions {
      position: absolute;
      right: 0;
      top: 8px;
      min-width: 140px;
      text-align: right;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 16px;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button[hidden] {
      display: none;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      color: var(--error);
    }

    .table-wrap {
      border: 0;
      border-radius: 12px;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      background: white;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      height: 72px;
      min-width: 86px;
      padding: 0 30px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: var(--head);
      border-bottom-color: #dfe4e8;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    td {
      background: white;
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
    }

    td:first-child,
    th:first-child {
      text-align: center;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.editable {
      cursor: pointer;
    }

    td.editing {
      max-width: var(--editing-cell-width);
      min-width: var(--editing-cell-width);
      padding-left: 8px;
      padding-right: 8px;
      width: var(--editing-cell-width);
    }

    .cell-input {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 42px;
      border: 1px solid #d7dde2;
      border-radius: 6px;
      color: var(--text);
      background: white;
      box-sizing: border-box;
      font: inherit;
      padding: 6px 8px;
      text-align: center;
      outline: none;
    }

    .cell-input:focus {
      border-color: #b9c1ca;
      box-shadow: none;
    }

    .cell-input::selection {
      background: #d9deef;
      color: var(--text);
    }

    @media (max-width: 768px) {
      main {
        width: calc(100vw - 24px);
        margin-top: 24px;
      }

      h1 {
        font-size: 30px;
      }

      th,
      td {
        min-width: 64px;
        height: 58px;
        padding: 0 12px;
        font-size: 14px;
      }

      td.editing {
        padding-left: 4px;
        padding-right: 4px;
      }

      .cell-input {
        height: 34px;
        padding: 4px 6px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>烈火灼心</h1>
      <div class="actions">
        <button id="sortButton" hidden>更新排名顺序</button>
      </div>
    </div>
    <section class="card">
      <div id="status" class="status"></div>
      <div class="table-wrap">
        <table id="rankTable" aria-label="烈火灼心排行榜"></table>
      </div>
    </section>
  </main>

  <script>
    const table = document.querySelector('#rankTable');
    const statusEl = document.querySelector('#status');
    const sortButton = document.querySelector('#sortButton');

    let tableHeader = [];
    let tableData = [];
    let activeEditor = null;

    init();

    sortButton.addEventListener('click', async () => {
      finishActiveEditor();
      tableData = getSortedRows();
      render();
      updateSortButton();
      await saveData();
    });

    async function init() {
      try {
        const response = await fetch('/api/data');
        if (!response.ok) {
          throw new Error('读取 fire.json 失败');
        }
        const config = await response.json();
        loadConfig(config);
        calculateAll();
        render();
        updateSortButton();
        await saveData();
      } catch (error) {
        showError(error.message);
      }
    }

    function loadConfig(config) {
      if (!Array.isArray(config.table_header) || !config.table_header.every(item => typeof item === 'string')) {
        throw new Error('配置错误：table_header 必须是字符串数组。');
      }
      if (!Array.isArray(config.table_data)) {
        throw new Error('配置错误：table_data 必须是数组。');
      }
      if (config.table_header.length < 7) {
        throw new Error('配置错误：表格至少需要 7 列。');
      }

      tableHeader = config.table_header.slice();
      tableData = config.table_data.map((row, rowIndex) => normalizeRow(row, rowIndex));
      validateUniqueNames();
    }

    function normalizeRow(row, rowIndex) {
      if (!Array.isArray(row)) {
        throw new Error(`配置错误：第 ${rowIndex + 1} 行不是数组。`);
      }
      const x = tableHeader.length;
      const normalized = [];
      for (let colIndex = 0; colIndex < x; colIndex += 1) {
        if (colIndex === 0) {
          if (typeof row[colIndex] !== 'string' || row[colIndex].trim() === '') {
            throw new Error(`配置错误：第 ${rowIndex + 1} 行第一列必须是非空字符串。`);
          }
          normalized[colIndex] = row[colIndex];
        } else {
          normalized[colIndex] = toNumber(row[colIndex]);
        }
      }
      return normalized;
    }

    function validateUniqueNames() {
      const names = new Set();
      for (const row of tableData) {
        const name = row[0];
        if (names.has(name)) {
          throw new Error(`配置错误：第一列存在重复值「${name}」，无法作为唯一行标识。`);
        }
        names.add(name);
      }
    }

    function render() {
      table.replaceChildren();
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      tableHeader.forEach(header => {
        const th = document.createElement('th');
        th.textContent = header;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      tableData.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        row.forEach((value, colIndex) => {
          const td = document.createElement('td');
          td.textContent = getDisplayValue(value, colIndex);
          if (isEditableColumn(colIndex)) {
            td.classList.add('editable');
            td.addEventListener('click', () => startEditing(td, rowIndex, colIndex));
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
    }

    function startEditing(cell, rowIndex, colIndex) {
      if (activeEditor) {
        finishActiveEditor();
      }

      const oldValue = tableData[rowIndex][colIndex];
      const input = document.createElement('input');
      input.className = 'cell-input';
      input.type = 'text';
      input.inputMode = 'numeric';
      input.value = oldValue > 0 ? String(oldValue) : '';

      cell.style.setProperty('--editing-cell-width', `${cell.offsetWidth}px`);
      cell.classList.add('editing');
      activeEditor = { cell, input, rowIndex, colIndex, oldValue };
      cell.replaceChildren(input);
      input.focus();
      input.select();

      cell.addEventListener('mouseleave', finishActiveEditor, { once: true });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          finishActiveEditor();
        }
      });
    }

    function finishActiveEditor() {
      if (!activeEditor) {
        return;
      }

      const editor = activeEditor;
      activeEditor = null;
      editor.cell.classList.remove('editing');
      editor.cell.style.removeProperty('--editing-cell-width');
      const value = editor.input.value.trim();
      const currentValue = tableData[editor.rowIndex][editor.colIndex];

      const nextValue = value === '' ? 0 : Number(value);
      if (value !== '' && !isPositiveInteger(value)) {
        editor.cell.textContent = getDisplayValue(currentValue, editor.colIndex);
        return;
      }

      if (nextValue === currentValue) {
        editor.cell.textContent = getDisplayValue(currentValue, editor.colIndex);
        return;
      }

      tableData[editor.rowIndex][editor.colIndex] = nextValue;
      calculateAll();
      render();
      updateSortButton();
      saveData();
    }

    function calculateAll() {
      const x = tableHeader.length;
      const rowCount = tableData.length;
      const totalIndex = x - 6;     // z1
      const remainingIndex = x - 5; // z2
      const bonusIndex = x - 4;     // h
      const extraIndex = x - 3;     // e
      const scoreIndex = x - 2;     // z
      const rankIndex = x - 1;      // r

      tableData.forEach(row => {
        let sum = 0;
        for (let colIndex = 1; colIndex <= x - 7; colIndex += 1) {
          sum += getCountedValue(row[colIndex], rowCount);
        }
        row[totalIndex] = sum;
        row[remainingIndex] = (x - 7) * rowCount - sum;
        row[scoreIndex] = row[remainingIndex] + toNumber(row[bonusIndex]) + toNumber(row[extraIndex]);
        row[rankIndex] = 0;
      });

      const scores = tableData
        .map(row => toNumber(row[scoreIndex]))
        .slice()
        .sort((a, b) => b - a);

      tableData.forEach(row => {
        row[rankIndex] = scores.findIndex(score => score === toNumber(row[scoreIndex])) + 1;
      });
    }

    function getSortedRows() {
      const x = tableHeader.length;
      const rankIndex = x - 1;
      const scoreIndex = x - 2;
      return tableData
        .map((row, index) => ({ row, index }))
        .sort((a, b) => {
          const rankDiff = toNumber(a.row[rankIndex]) - toNumber(b.row[rankIndex]);
          if (rankDiff !== 0) {
            return rankDiff;
          }
          const scoreDiff = toNumber(b.row[scoreIndex]) - toNumber(a.row[scoreIndex]);
          if (scoreDiff !== 0) {
            return scoreDiff;
          }
          return a.index - b.index;
        })
        .map(item => item.row);
    }

    function updateSortButton() {
      const sorted = getSortedRows();
      const changed = sorted.some((row, index) => row[0] !== tableData[index][0]);
      sortButton.hidden = !changed;
    }

    async function saveData() {
      clearStatus();
      try {
        const response = await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            table_header: tableHeader,
            table_data: tableData,
          }),
        });
        if (!response.ok) {
          throw new Error('保存失败，请检查服务是否正常运行。');
        }
      } catch (error) {
        showError(error.message);
      }
    }

    function isEditableColumn(colIndex) {
      const x = tableHeader.length;
      return (colIndex >= 1 && colIndex <= x - 7) || colIndex === x - 4 || colIndex === x - 3;
    }

    function getDisplayValue(value, colIndex) {
      if (isEditableColumn(colIndex) && toNumber(value) <= 0) {
        return '';
      }
      return String(value ?? '');
    }

    function isPositiveInteger(value) {
      return /^[1-9][0-9]*$/.test(value);
    }

    function getCountedValue(value, fallback) {
      const number = Number(value);
      if (!Number.isFinite(number) || number <= 0) {
        return fallback;
      }
      return number;
    }

    function toNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        throw new Error('配置错误：数字列必须是有效数字。');
      }
      return number;
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.classList.add('error');
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.classList.remove('error');
    }
  </script>
</body>
</html>
